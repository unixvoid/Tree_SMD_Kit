; Shared settings inherited by every animation environment below.
[env]
platform = atmelmegaavr@1.9.0
; Use the board manifest maintained by the pinned atmelmegaavr platform.
; NOTE: PlatformIO derives the board ID from the manifest FILENAME and matches it
; case-sensitively, so this must be exactly "ATtiny1614" (the platform ships
; ATtiny1614.json) or the build fails with UnknownBoard on Linux.
board = ATtiny1614
framework = arduino
upload_protocol = serialupdi
board_fuses.BODCFG = 0x00

; One environment per animation. The env name IS the animation name: it becomes
; the build directory .pio/build/<name>/firmware.hex and the S3 key prefix
; ornament/<name>/ that the web flasher lists.
;
; To add an animation: create src/<name>/main.cpp and add an env here with a
; matching build_src_filter. Without the filter, every animation's main.cpp is
; compiled into every binary and the link fails loudly with
; "multiple definition of setup".
[env:demo]
build_src_filter = +<demo/>

[env:pong]
build_src_filter = +<pong/>

[env:snowfall]
build_src_filter = +<snowfall/>